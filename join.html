<!-- ========================================================
     CUSTOM HTML REGISTRATION FORM
========================================================= -->

<section class="join-form-section" style="background:#f5f8fc; padding:40px 0;">

    <div class="join-form-box" style="max-width:820px;">

        <h2>
            📝 सदस्य / स्वयंसेवक पंजीकरण
        </h2>

        <p class="lead">
            कृपया नीचे दिए गए फॉर्म को भरें और हमारी टीम का हिस्सा बनें।
            <br>
            Please fill the form below to join our team.
        </p>

        <!-- ===== LANGUAGE TOGGLE ===== -->
        <div style="margin-bottom:20px; display:flex; justify-content:center; gap:10px;">
            <button onclick="setLang('hi')" id="langHi" style="
                background: #063b78;
                color: white;
                border: none;
                padding: 8px 25px;
                border-radius: 30px;
                font-weight: 700;
                font-size: 14px;
                cursor: pointer;
            ">🇮🇳 हिंदी</button>
            <button onclick="setLang('en')" id="langEn" style="
                background: #ddd;
                color: #333;
                border: none;
                padding: 8px 25px;
                border-radius: 30px;
                font-weight: 700;
                font-size: 14px;
                cursor: pointer;
            ">🇬🇧 English</button>
        </div>

        <!-- ===== FORM ===== -->
        <form id="registrationForm" style="text-align:left;">

            <!-- 1. Membership Type -->
            <div style="margin-bottom:16px;">
                <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                    <span class="hi">आप किस रूप में "साथ चले हम" से जुड़ना चाहते हैं? <span style="color:#b21f1f;">*</span></span>
                    <span class="en">How would you like to join "Sath Chale Hum"? <span style="color:#b21f1f;">*</span></span>
                </label>
                <select id="membershipType" required style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:15px;">
                    <option value="">-- चुनें / Select --</option>
                    <option value="सदस्य">सदस्य / Member</option>
                    <option value="स्वयंसेवक">स्वयंसेवक / Volunteer</option>
                    <option value="सदस्य एवं स्वयंसेवक दोनों">सदस्य एवं स्वयंसेवक दोनों / Both</option>
                </select>
            </div>

            <!-- 2. Why Join -->
            <div style="margin-bottom:16px;">
                <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                    <span class="hi">आप हमारे साथ क्यों जुड़ना चाहते हैं? <span style="color:#b21f1f;">*</span></span>
                    <span class="en">Why would you like to join us? <span style="color:#b21f1f;">*</span></span>
                </label>
                <textarea id="whyJoin" rows="2" placeholder="अपनी प्रेरणा साझा करें / Share your motivation..." required style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:15px; font-family:inherit;"></textarea>
            </div>

            <!-- 3. Name (First + Middle + Last) -->
            <div style="font-weight:700; color:#063b78; margin:20px 0 12px; font-size:16px; background:#f0f3f8; padding:8px 15px; border-radius:8px; border-left:4px solid #ff7900;">
                <span class="hi">👤 नाम / Name</span>
                <span class="en">👤 Name</span>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:16px;">
                <div>
                    <label style="font-weight:600; color:#063b78; display:block; font-size:13px;">
                        <span class="hi">पहला नाम <span style="color:#b21f1f;">*</span></span>
                        <span class="en">First Name <span style="color:#b21f1f;">*</span></span>
                    </label>
                    <input type="text" id="firstName" placeholder="First" required style="width:100%; padding:10px 12px; border:2px solid #dce1e8; border-radius:8px; font-size:14px;">
                </div>
                <div>
                    <label style="font-weight:600; color:#063b78; display:block; font-size:13px;">
                        <span class="hi">मध्य नाम</span>
                        <span class="en">Middle Name</span>
                    </label>
                    <input type="text" id="middleName" placeholder="Middle" style="width:100%; padding:10px 12px; border:2px solid #dce1e8; border-radius:8px; font-size:14px;">
                </div>
                <div>
                    <label style="font-weight:600; color:#063b78; display:block; font-size:13px;">
                        <span class="hi">अंतिम नाम <span style="color:#b21f1f;">*</span></span>
                        <span class="en">Last Name <span style="color:#b21f1f;">*</span></span>
                    </label>
                    <input type="text" id="lastName" placeholder="Last" required style="width:100%; padding:10px 12px; border:2px solid #dce1e8; border-radius:8px; font-size:14px;">
                </div>
            </div>

            <!-- 4. Guardian Name -->
            <div style="margin-bottom:16px;">
                <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                    <span class="hi">पिता / माता / अभिभावक का नाम <span style="color:#b21f1f;">*</span></span>
                    <span class="en">Father's / Mother's / Guardian's Name <span style="color:#b21f1f;">*</span></span>
                </label>
                <input type="text" id="guardianName" placeholder="अभिभावक का पूरा नाम / Full name of guardian" required style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:15px;">
            </div>

            <!-- 5. DOB + Gender -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:16px;">
                <div>
                    <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                        <span class="hi">जन्म तिथि <span style="color:#b21f1f;">*</span></span>
                        <span class="en">Date of Birth <span style="color:#b21f1f;">*</span></span>
                    </label>
                    <input type="date" id="dob" required style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:15px;">
                </div>
                <div>
                    <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                        <span class="hi">लिंग <span style="color:#b21f1f;">*</span></span>
                        <span class="en">Gender <span style="color:#b21f1f;">*</span></span>
                    </label>
                    <select id="gender" required style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:15px;">
                        <option value="">-- चुनें / Select --</option>
                        <option value="पुरुष">पुरुष / Male</option>
                        <option value="महिला">महिला / Female</option>
                        <option value="अन्य">अन्य / Other</option>
                    </select>
                </div>
            </div>

            <!-- 6. Mobile + Email -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:16px;">
                <div>
                    <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                        <span class="hi">मोबाइल नंबर <span style="color:#b21f1f;">*</span></span>
                        <span class="en">Mobile Number <span style="color:#b21f1f;">*</span></span>
                        <span style="font-weight:400; color:#888; font-size:12px;">(10 अंक / 10 digits)</span>
                    </label>
                    <input type="tel" id="mobile" placeholder="9876543210" maxlength="10" required style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:15px;">
                </div>
                <div>
                    <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                        <span class="hi">ईमेल पता</span>
                        <span class="en">Email Address</span>
                    </label>
                    <input type="email" id="email" placeholder="example@email.com" style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:15px;">
                </div>
            </div>

            <!-- 7. Address -->
            <div style="margin-bottom:16px;">
                <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                    <span class="hi">पूरा पता <span style="color:#b21f1f;">*</span></span>
                    <span class="en">Full Address <span style="color:#b21f1f;">*</span></span>
                </label>
                <textarea id="address" rows="2" placeholder="घर का नंबर, गली, मोहल्ला / House no, street, locality..." required style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:15px; font-family:inherit;"></textarea>
            </div>

            <!-- 8. District + State + PIN -->
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:16px;">
                <div>
                    <label style="font-weight:600; color:#063b78; display:block; font-size:13px;">
                        <span class="hi">जिला <span style="color:#b21f1f;">*</span></span>
                        <span class="en">District <span style="color:#b21f1f;">*</span></span>
                    </label>
                    <input type="text" id="district" placeholder="जिला / District" required style="width:100%; padding:10px 12px; border:2px solid #dce1e8; border-radius:8px; font-size:14px;">
                </div>
                <div>
                    <label style="font-weight:600; color:#063b78; display:block; font-size:13px;">
                        <span class="hi">राज्य <span style="color:#b21f1f;">*</span></span>
                        <span class="en">State <span style="color:#b21f1f;">*</span></span>
                    </label>
                    <select id="state" required style="width:100%; padding:10px 12px; border:2px solid #dce1e8; border-radius:8px; font-size:14px;">
                        <option value="">-- चुनें / Select --</option>
                        <option value="Bihar">Bihar</option>
                        <option value="Other">Other / अन्य</option>
                    </select>
                </div>
                <div>
                    <label style="font-weight:600; color:#063b78; display:block; font-size:13px;">
                        <span class="hi">पिन कोड <span style="color:#b21f1f;">*</span></span>
                        <span class="en">PIN Code <span style="color:#b21f1f;">*</span></span>
                        <span style="font-weight:400; color:#888; font-size:11px;">(6 अंक)</span>
                    </label>
                    <input type="text" id="pincode" placeholder="110001" maxlength="6" required style="width:100%; padding:10px 12px; border:2px solid #dce1e8; border-radius:8px; font-size:14px;">
                </div>
            </div>

            <!-- 9. Education -->
            <div style="margin-bottom:16px;">
                <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                    <span class="hi">शैक्षणिक योग्यता <span style="color:#b21f1f;">*</span></span>
                    <span class="en">Educational Qualification <span style="color:#b21f1f;">*</span></span>
                </label>
                <select id="education" required style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:15px;">
                    <option value="">-- चुनें / Select --</option>
                    <option value="10वीं से कम">10वीं से कम / Below 10th</option>
                    <option value="10वीं उत्तीर्ण">10वीं उत्तीर्ण / 10th Pass</option>
                    <option value="12वीं उत्तीर्ण">12वीं उत्तीर्ण / 12th Pass</option>
                    <option value="स्नातकोत्तर">स्नातकोत्तर / Post Graduate</option>
                    <option value="व्यावसायिक / तकनीकी">व्यावसायिक / तकनीकी / Professional</option>
                    <option value="अन्य">अन्य / Other</option>
                </select>
            </div>

            <!-- 10. Profession -->
            <div style="margin-bottom:16px;">
                <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                    <span class="hi">व्यवसाय / पेशा</span>
                    <span class="en">Profession / Occupation</span>
                </label>
                <input type="text" id="profession" placeholder="जैसे: शिक्षक, डॉक्टर, छात्र... / Teacher, Doctor, Student..." style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:15px;">
            </div>

            <!-- 11. Skills (Multiple Select) -->
            <div style="margin-bottom:16px;">
                <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                    <span class="hi">आपके पास कौन-कौन से कौशल हैं? <span style="color:#b21f1f;">*</span></span>
                    <span class="en">What skills do you have? <span style="color:#b21f1f;">*</span></span>
                    <span style="font-weight:400; color:#888; font-size:12px;">(Ctrl+Click से एक से अधिक चुनें)</span>
                </label>
                <select id="skills" multiple size="4" required style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:14px; min-height:100px;">
                    <option value="शिक्षण / Teaching">शिक्षण / Teaching</option>
                    <option value="लेखन / Writing">लेखन / Writing</option>
                    <option value="फंड जुटाना / Fundraising">फंड जुटाना / Fundraising</option>
                    <option value="स्वास्थ्य सेवा / Healthcare">स्वास्थ्य सेवा / Healthcare</option>
                    <option value="सामाजिक मीडिया / Social Media">सामाजिक मीडिया / Social Media</option>
                    <option value="कंप्यूटर / Computer Skills">कंप्यूटर / Computer Skills</option>
                    <option value="फोटोग्राफी / Photography">फोटोग्राफी / Photography</option>
                    <option value="वकालत / Advocacy">वकालत / Advocacy</option>
                    <option value="अन्य / Other">अन्य / Other</option>
                </select>
            </div>

            <!-- 12. Languages (Multiple Select) -->
            <div style="margin-bottom:16px;">
                <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                    <span class="hi">आप किन भाषाओं में सहज हैं? <span style="color:#b21f1f;">*</span></span>
                    <span class="en">Which languages are you comfortable with? <span style="color:#b21f1f;">*</span></span>
                    <span style="font-weight:400; color:#888; font-size:12px;">(Ctrl+Click से एक से अधिक चुनें)</span>
                </label>
                <select id="languages" multiple size="4" required style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:14px; min-height:100px;">
                    <option value="हिन्दी">हिन्दी / Hindi</option>
                    <option value="English">English</option>
                    <option value="उर्दू">उर्दू / Urdu</option>
                    <option value="मैथिली">मैथिली / Maithili</option>
                    <option value="भोजपुरी">भोजपुरी / Bhojpuri</option>
                    <option value="बांग्ला">बांग्ला / Bengali</option>
                    <option value="मराठी">मराठी / Marathi</option>
                    <option value="अन्य / Other">अन्य / Other</option>
                </select>
            </div>

            <!-- 13. Work Areas (Multiple Select) -->
            <div style="margin-bottom:16px;">
                <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                    <span class="hi">आप "साथ चले हम" के किन क्षेत्रों में सहयोग करना चाहते हैं? <span style="color:#b21f1f;">*</span></span>
                    <span class="en">Which areas of work would you like to contribute to? <span style="color:#b21f1f;">*</span></span>
                    <span style="font-weight:400; color:#888; font-size:12px;">(Ctrl+Click से एक से अधिक चुनें)</span>
                </label>
                <select id="workAreas" multiple size="5" required style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:14px; min-height:120px;">
                    <option value="शिक्षा / Education">📚 शिक्षा / Education</option>
                    <option value="स्वास्थ्य / Health">🏥 स्वास्थ्य / Health</option>
                    <option value="पर्यावरण / Environment">🌳 पर्यावरण / Environment</option>
                    <option value="महिला सशक्तिकरण / Women Empowerment">💪 महिला सशक्तिकरण</option>
                    <option value="बाल अधिकार / Child Rights">👶 बाल अधिकार / Child Rights</option>
                    <option value="फंड जुटाना / Fundraising">💰 फंड जुटाना / Fundraising</option>
                    <option value="कानूनी सहायता / Legal Aid">⚖️ कानूनी सहायता / Legal Aid</option>
                    <option value="डिजिटल साक्षरता / Digital Literacy">💻 डिजिटल साक्षरता</option>
                    <option value="अन्य / Other">🔹 अन्य / Other</option>
                </select>
            </div>

            <!-- 14. Time + Contribution Type -->
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:16px;">
                <div>
                    <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                        <span class="hi">सप्ताह में समय <span style="color:#b21f1f;">*</span></span>
                        <span class="en">Time per week <span style="color:#b21f1f;">*</span></span>
                    </label>
                    <select id="timeCommitment" required style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:15px;">
                        <option value="">-- चुनें / Select --</option>
                        <option value="1-2 घंटे">1-2 घंटे / hours</option>
                        <option value="3-5 घंटे">3-5 घंटे / hours</option>
                        <option value="6-10 घंटे">6-10 घंटे / hours</option>
                        <option value="10+ घंटे">10+ घंटे / hours</option>
                    </select>
                </div>
                <div>
                    <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                        <span class="hi">योगदान का प्रकार <span style="color:#b21f1f;">*</span></span>
                        <span class="en">Contribution Type <span style="color:#b21f1f;">*</span></span>
                    </label>
                    <select id="contributionType" required style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:15px;">
                        <option value="">-- चुनें / Select --</option>
                        <option value="ऑनलाइन">ऑनलाइन / Online</option>
                        <option value="ऑफलाइन">ऑफलाइन / Offline</option>
                        <option value="दोनों">दोनों / Both</option>
                    </select>
                </div>
            </div>

            <!-- 15. How did you hear -->
            <div style="margin-bottom:16px;">
                <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                    <span class="hi">आपको "साथ चले हम" के बारे में कैसे पता चला? <span style="color:#b21f1f;">*</span></span>
                    <span class="en">How did you hear about "Sath Chale Hum"? <span style="color:#b21f1f;">*</span></span>
                </label>
                <select id="heardFrom" required style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:15px;">
                    <option value="">-- चुनें / Select --</option>
                    <option value="Facebook">Facebook</option>
                    <option value="Instagram">Instagram</option>
                    <option value="WhatsApp">WhatsApp</option>
                    <option value="YouTube">YouTube</option>
                    <option value="समाचार पत्र / Newspaper">समाचार पत्र / Newspaper</option>
                    <option value="मित्र / Friend">मित्र / Friend</option>
                    <option value="कार्यक्रम / Event">कार्यक्रम / Event</option>
                    <option value="स्कूल / कॉलेज / School/College">स्कूल / कॉलेज / School/College</option>
                    <option value="अन्य / Other">अन्य / Other</option>
                </select>
            </div>

            <!-- 16. Previous Experience -->
            <div style="margin-bottom:16px;">
                <label style="font-weight:700; color:#063b78; display:block; margin-bottom:4px;">
                    <span class="hi">क्या आपको किसी NGO में पहले का अनुभव है? <span style="color:#b21f1f;">*</span></span>
                    <span class="en">Previous NGO experience? <span style="color:#b21f1f;">*</span></span>
                </label>
                <select id="previousExperience" required style="width:100%; padding:11px 14px; border:2px solid #dce1e8; border-radius:10px; font-size:15px;">
                    <option value="">-- चुनें / Select --</option>
                    <option value="हाँ">हाँ / Yes</option>
                    <option value="नहीं">नहीं / No</option>
                </select>
            </div>

            <!-- Experience Details (hidden) -->
            <div id="expDetails" style="display:none; background:#f8faff; padding:15px; border-radius:12px; margin-bottom:16px; border:1px solid #dce1e8;">
                <div style="margin-bottom:12px;">
                    <label style="font-weight:600; color:#063b78; display:block; font-size:13px;">
                        <span class="hi">संस्था का नाम</span>
                        <span class="en">Organization Name</span>
                    </label>
                    <input type="text" id="orgName" placeholder="संस्था का नाम / Organization name" style="width:100%; padding:10px 12px; border:2px solid #dce1e8; border-radius:8px; font-size:14px;">
                </div>
                <div style="margin-bottom:12px;">
                    <label style="font-weight:600; color:#063b78; display:block; font-size:13px;">
                        <span class="hi">आपकी भूमिका</span>
                        <span class="en">Your Role</span>
                    </label>
                    <input type="text" id="role" placeholder="भूमिका / Role" style="width:100%; padding:10px 12px; border:2px solid #dce1e8; border-radius:8px; font-size:14px;">
                </div>
                <div>
                    <label style="font-weight:600; color:#063b78; display:block; font-size:13px;">
                        <span class="hi">कितने समय तक जुड़े रहे?</span>
                        <span class="en">Duration</span>
                    </label>
                    <input type="text" id="duration" placeholder="जैसे: 2 साल / e.g., 2 years" style="width:100%; padding:10px 12px; border:2px solid #dce1e8; border-radius:8px; font-size:14px;">
                </div>
            </div>

            <!-- 17. Describe Experience -->
