<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sath Chale Hum Foundation | साथ चले हम</title>

<meta name="description"
content="Sath Chale Hum Foundation - Service, Support and Awareness for Positive Social Change.">

<style>

/* =========================================================
   RESET + ROOT
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
    Arial,
    "Noto Sans Devanagari",
    "Segoe UI",
    sans-serif;

    background:#f5f8fc;
    color:#17324d;
    line-height:1.6;
}

:root{
    --blue:#063b78;
    --dark-blue:#032b5c;
    --blue2:#0a67b8;

    --orange:#ff7900;
    --orange-dark:#e85d00;

    --green:#159447;
    --green-dark:#0d7b39;

    --white:#ffffff;
    --light-blue:#edf6ff;
    --light-green:#effbf4;

    --text:#17324d;
    --muted:#63768a;

    --shadow:
    0 12px 35px rgba(0,45,90,.11);
}


/* =========================================================
   COMMON
========================================================= */

.container{
    width:min(1250px,92%);
    margin:auto;
}

section{
    padding:75px 0;
}

.section-heading{
    text-align:center;
    margin-bottom:42px;
}

.section-heading h2{
    color:var(--blue);
    font-size:32px;
    font-weight:900;
}

.section-heading p{
    color:var(--muted);
    margin-top:6px;
}

.card{
    background:#fff;
    border-radius:18px;
    box-shadow:var(--shadow);
}


/* =========================================================
   BUTTONS
========================================================= */

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    min-height:46px;
    padding:11px 23px;

    border-radius:30px;

    text-decoration:none;
    font-weight:800;

    border:2px solid transparent;

    transition:
    transform .25s ease,
    box-shadow .25s ease,
    background .25s ease;
}

.btn:hover{
    transform:translateY(-3px);
}

.btn-orange{
    background:var(--orange);
    color:#fff;
    box-shadow:0 7px 20px rgba(255,121,0,.28);
}

.btn-green{
    background:var(--green);
    color:#fff;
    box-shadow:0 7px 20px rgba(21,148,71,.25);
}

.btn-white{
    background:#fff;
    color:var(--blue);
}


/* =========================================================
   HEADER
========================================================= */

.top-header{
    background:
    linear-gradient(
        135deg,
        #022b5c 0%,
        #075aa8 50%,
        #063b78 100%
    );

    color:#fff;

    padding:15px 4%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:25px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.brand-logo{
    width:78px;
    height:78px;

    object-fit:contain;

    background:#fff;

    border-radius:50%;

    padding:4px;

    box-shadow:
    0 5px 18px rgba(0,0,0,.18);
}

.brand-text h1{
    font-size:27px;
    line-height:1.2;
    font-weight:900;
}

.brand-text p{
    font-size:14px;
    margin-top:3px;
    color:#fff;
}

.header-buttons{
    display:flex;
    gap:12px;
}


/* =========================================================
   NAVIGATION
========================================================= */

.navbar{
    background:#fff;

    position:sticky;
    top:0;

    z-index:9999;

    box-shadow:
    0 4px 18px rgba(0,0,0,.08);
}

.nav-container{
    width:min(1250px,92%);
    margin:auto;

    display:flex;
    justify-content:center;
}

.nav-links{
    list-style:none;

    display:flex;
    align-items:center;
}

.nav-links a{
    display:block;

    padding:16px 21px;

    color:var(--blue);

    text-decoration:none;

    font-weight:800;

    position:relative;

    transition:.25s;
}

.nav-links a::after{
    content:"";

    position:absolute;

    left:20px;
    right:20px;
    bottom:8px;

    height:2px;

    background:var(--orange);

    transform:scaleX(0);

    transition:.25s;
}

.nav-links a:hover{
    color:var(--orange);
}

.nav-links a:hover::after{
    transform:scaleX(1);
}

.menu-toggle{
    display:none;

    padding:12px 4%;

    text-align:right;

    color:var(--blue);

    font-size:29px;

    cursor:pointer;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    background:
    linear-gradient(
        135deg,
        #eaf5ff,
        #ffffff
    );

    padding:72px 0;
}

.hero-grid{
    width:min(1250px,92%);
    margin:auto;

    display:grid;

    grid-template-columns:
    1.05fr
    .95fr;

    gap:55px;

    align-items:center;
}

.hero-content .small-title{
    color:var(--orange);

    font-size:21px;

    font-weight:900;

    margin-bottom:3px;
}

.hero-content h2{
    color:var(--blue);

    font-size:50px;

    line-height:1.12;

    font-weight:900;
}

.hero-content h3{
    color:#41627d;

    font-size:24px;

    margin:10px 0 18px;
}

.hero-content p{
    color:#536a7c;

    font-size:17px;

    max-width:680px;

    margin-bottom:8px;
}

.hero-buttons{
    display:flex;

    gap:13px;

    flex-wrap:wrap;

    margin-top:25px;
}


/* HERO LOGO BOX */

.hero-logo-box{
    min-height:390px;

    background:
    linear-gradient(
        145deg,
        #ffffff,
        #eef7ff
    );

    border-radius:28px;

    border:1px solid #dcecfb;

    box-shadow:
    0 18px 45px rgba(0,53,105,.13);

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    overflow:hidden;
}

.hero-logo-box::before{
    content:"";

    position:absolute;

    width:280px;
    height:280px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(10,103,184,.10),
        transparent 70%
    );
}

.hero-logo{
    width:270px;

    max-width:72%;

    height:auto;

    object-fit:contain;

    position:relative;

    z-index:2;
}

.hero-logo-caption{
    position:absolute;

    bottom:18px;

    left:50%;

    transform:translateX(-50%);

    width:85%;

    text-align:center;

    color:var(--blue);

    font-weight:800;

    font-size:14px;
}


/* =========================================================
   ABOUT
========================================================= */

.about-box{
    max-width:1000px;

    margin:auto;
