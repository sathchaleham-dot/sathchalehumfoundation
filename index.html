<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sath Chale Hum Foundation | साथ चले हम</title>

<meta name="description" content="Sath Chale Hum Foundation — साथ चले हम, बदलाव की ओर। सेवा, सहयोग और जागरूकता के माध्यम से सकारात्मक सामाजिक बदलाव।">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, "Noto Sans Devanagari", sans-serif;
    background:#f5f8fc;
    color:#17233c;
    line-height:1.6;
}

:root{
    --blue:#062b66;
    --blue2:#0a4b9c;
    --blue3:#0d65c8;
    --light-blue:#eef5ff;
    --orange:#ff7a00;
    --orange2:#ff9d2e;
    --green:#16a05d;
    --white:#ffffff;
    --text:#17233c;
    --muted:#68758a;
    --shadow:0 12px 35px rgba(4,38,91,.12);
    --radius:18px;
}

/* =========================
   HEADER
========================= */

.top-header{
    background:linear-gradient(135deg,#031b42,#062b66 50%,#0b55a8);
    color:white;
    padding:15px 5%;
    box-shadow:0 5px 25px rgba(0,0,0,.18);
}

.header-inner{
    max-width:1250px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.brand-logo{
    width:70px;
    height:70px;
    object-fit:contain;
    background:#fff;
    border-radius:12px;
    padding:4px;
}

.brand-text h1{
    font-size:25px;
    font-weight:800;
    letter-spacing:.2px;
}

.brand-text p{
    font-size:14px;
    color:#dbeaff;
    margin-top:2px;
}

.header-buttons{
    display:flex;
    gap:12px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-decoration:none;
    border:none;
    cursor:pointer;
    font-weight:800;
    padding:12px 22px;
    border-radius:50px;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 22px rgba(0,0,0,.18);
}

.btn-orange{
    background:var(--orange);
    color:#fff;
}

.btn-green{
    background:var(--green);
    color:#fff;
}

.btn-white{
    background:#fff;
    color:var(--blue);
}

.btn-blue{
    background:var(--blue);
    color:#fff;
}

/* =========================
   NAVIGATION
========================= */

.navbar{
    background:#fff;
    position:sticky;
    top:0;
    z-index:999;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
}

.nav-inner{
    max-width:1250px;
    margin:auto;
    padding:0 5%;
    min-height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.nav-links{
    display:flex;
    list-style:none;
    gap:4px;
}

.nav-links a{
    display:block;
    text-decoration:none;
    color:#18335d;
    font-weight:700;
    padding:17px 16px;
    font-size:14px;
    transition:.25s;
}

.nav-links a:hover{
    color:var(--orange);
}

.menu-toggle{
    display:none;
    border:none;
    background:none;
    font-size:29px;
    color:var(--blue);
    cursor:pointer;
}

/* =========================
   HERO
========================= */

.hero{
    background:
        linear-gradient(100deg,rgba(3,29,69,.97),rgba(7,65,132,.88)),
        url("hero-image.jpg") center/cover;
    color:#fff;
    padding:85px 5%;
}

.hero-inner{
    max-width:1250px;
    margin:auto;
    display:grid;
    grid-template-columns:1.05fr .95fr;
    gap:55px;
    align-items:center;
}

.hero-content .small-title{
    color:#ffb45c;
    font-size:17px;
    font-weight:700;
    margin-bottom:7px;
}

.hero-content h2{
    font-size:52px;
    line-height:1.12;
    font-weight:900;
}

.hero-content h3{
    color:#ff9d2e;
    font-size:31px;
    margin:8px 0;
}

.hero-content .english{
    font-size:21px;
    color:#dceaff;
    font-weight:700;
    margin-bottom:18px;
}

.hero-content .intro{
    max-width:650px;
    font-size:18px;
    color:#eef5ff;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:13px;
    margin-top:27px;
}

.hero-visual{
    min-height:370px;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,.3);
    background:
        linear-gradient(rgba(0,34,78,.15),rgba(0,34,78,.15)),
        url("hero-image.jpg") center/cover;
}

/* =========================
   GENERAL
========================= */

.section{
    padding:75px 5%;
}

.section-inner{
    max-width:1250px;
    margin:auto;
}

.section-heading{
    text-align:center;
    margin-bottom:42px;
}

.section-heading h2{
    color:var(--blue);
    font-size:34px;
    font-weight:900;
}

.section-heading p{
    color:var(--muted);
    margin-top:5px;
}

.orange-line{
    width:65px;
    height:4px;
    background:var(--orange);
    border-radius:10px;
    margin:12px auto;
}

/* =========================
   ABOUT
========================= */

.about-section{
    background:#fff;
}

.about-card{
    background:linear-gradient(135deg,#fff,#f2f7ff);
    border-left:5px solid var(--orange);
    padding:35px;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    font-size:17px;
}

.about-card strong{
    color:var(--blue);
}

/* =========================
   MISSION / VISION
========================= */

.mission-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.info-card{
    background:#fff;
    padding:32px;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border-top:5px solid var(--blue3);
}

.info-card.vision{
    border-top-color:var(--orange);
}

.card-title{
    font-size:23px;
    color:var(--blue);
    font-weight:900;
    margin-bottom:16px;
}

.info-card ul{
    padding-left:20px;
}

.info-card li{
    margin:9px 0;
}

/* =========================
   VALUES
========================= */

.values-section{
    background:var(--light-blue);
}

.values-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.value-card{
    background:#fff;
    padding:25px 20px;
    border-radius:17px;
    box-shadow:0 8px 25px rgba(0,40,100,.09);
    transition:.3s;
    border-bottom:4px solid var(--blue3);
}

.value-card:hover{
    transform:translateY(-6px);
}

.number{
    color:var(--orange);
    font-size:13px;
    font-weight:900;
}

.value-card h3{
    color:var(--blue);
    font-size:19px;
    margin:6px 0;
}

.value-card p{
    color:var(--muted);
    font-size:14px;
}

/* =========================
   WORK AREAS
========================= */

.work-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.work-card{
    background:#fff;
    border-radius:16px;
    padding:22px 18px;
    min-height:145px;
    box-shadow:var(--shadow);
    border:1px solid #e7eef8;
    transition:.3s;
}

.work-card:hover{
    transform:translateY(-5px);
    border-color:#8eb9ef;
}

.work-number{
    font-size:13px;
    color:var(--orange);
    font-weight:900;
}
