<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Donate Us | साथ चले हम फाउंडेशन</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================
   ROOT
========================================= */

:root{
    --blue-deep:#06478d;
    --blue-soft:#eaf2fb;
    --orange:#ff8a00;
    --orange-deep:#e94b00;
    --cream:#fff8ee;
    --ink:#2b2620;
    --ink-soft:#5b5650;
    --green:#16a34a;

    --border:#f0e2cd;
    --radius-lg:28px;
    --radius-md:20px;
}


/* =========================================
   BASIC
========================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--cream);
    font-family:"Noto Sans Devanagari",Arial,sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    line-height:1.75;
}

h1,
h2,
h3,
h4,
h5,
.display{
    font-family:"Baloo 2","Noto Sans Devanagari",sans-serif;
}

a{
    text-decoration:none;
    color:inherit;
}

button{
    font-family:inherit;
}


/* =========================================
   WRAPPER
========================================= */

.wrap{
    max-width:1000px;
    margin:0 auto;
    padding:0 32px;
}


/* =========================================
   BUTTON
========================================= */

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    font-weight:800;
    font-size:15px;

    padding:12px 22px;

    border-radius:40px;
    border:none;

    cursor:pointer;
    white-space:nowrap;

    transition:
        transform .2s,
        box-shadow .2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-donate{
    background:linear-gradient(
        90deg,
        #ff9800,
        #ff5a00
    );

    color:#fff;

    box-shadow:
        0 8px 18px rgba(255,122,0,.28);
}

.btn-join{
    background:var(--blue-deep);
    color:#fff;

    box-shadow:
        0 8px 18px rgba(6,71,141,.22);
}


/* =========================================
   NAVIGATION
========================================= */

.nav{
    position:sticky;
    top:0;

    z-index:100;

    background:rgba(255,248,238,.94);

    backdrop-filter:blur(10px);

    border-bottom:
        1px solid #f0e2cd;
}

.nav-inner{
    max-width:1240px;

    margin:0 auto;

    padding:15px 32px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;
}

.brand{
    font-size:25px;
    font-weight:800;

    color:var(--blue-deep);

    white-space:nowrap;
}

.brand .orange{
    color:var(--orange);
}

.nav-links{
    display:flex;

    align-items:center;

    gap:25px;

    font-weight:600;

    font-size:15px;

    color:var(--ink);
}

.nav-links a{
    transition:.2s;
}

.nav-links a:hover{
    color:var(--orange-deep);
}

.nav-links a.active{
    color:var(--orange-deep);
    font-weight:800;
}

.nav-ctas{
    display:flex;
    gap:10px;
}

.nav-toggle{
    display:none;

    font-size:27px;

    background:none;

    border:none;

    color:var(--blue-deep);

    cursor:pointer;
}


/* =========================================
   MOBILE NAV
========================================= */

@media(max-width:900px){

    .nav-links,
    .nav-ctas{
        display:none;
    }

    .nav-toggle{
        display:block;
    }

    .nav-inner{
        padding:14px 20px;
    }

    .brand{
        font-size:21px;
    }

    .nav.mobile-open{
        background:#fff8ee;
    }

    .nav.mobile-open .nav-inner{
        flex-wrap:wrap;
    }

    .nav.mobile-open .nav-links{
        display:flex;

        width:100%;

        flex-direction:column;

        align-items:flex-start;

        gap:0;

        padding:12px 0 0;
    }

    .nav.mobile-open .nav-links a{
        width:100%;

        padding:11px 5px;

        border-bottom:
            1px solid #f0e2cd;
    }

    .nav.mobile-open .nav-ctas{
        display:flex;

        width:100%;

        padding:14px 0 5px;

        flex-direction:column;
    }

    .nav.mobile-open .nav-ctas .btn{
        width:100%;
    }
}


/* =========================================
   HERO
========================================= */

.donate-hero{
    position:relative;

    padding:60px 20px 35px;

    text-align:center;

    overflow:hidden;
}

.blob{
    position:absolute;

    border-radius:50%;

    filter:blur(2px);

    opacity:.32;

    z-index:0;
}

.blob-1{
    width:340px;
    height:340px;

    background:
        radial-gradient(
            circle,
            #ffd9a0,
            transparent 70%
        );

    top:-120px;
    right:-100px;
}

.blob-2{
    width:300px;
    height:300px;

    background:
        radial-gradient(
            circle,
            #c7e0ff,
            transparent 70%
        );

    top:-60px;
    left:-100px;
}

.donate-hero .inner{
    position:relative;

    z-index:1;

    max-width:720px;

    margin:0 auto;
}

.eyebrow{
    display:inline-flex;

    align-items:center;

    gap:8px;

    font-size:13px;

    font-weight:800;

    letter-spacing:.08em;

    color:var(--orange-deep);

    background:#fff1e0;

    padding:8px 18px;

    border-radius:30px;
}

.donate-hero h1{
    margin-top:18px;

    font-size:46px;

    font-weight:800;

    line-height:1.2;
}

.donate-hero h1 .blue{
    color:var(--blue-deep);
}

.donate-hero h1 .orange{
    color:var(--orange-deep);
}

.donate-hero p{
    margin:15px auto 0;

    max-width:650px;

    font-size:17px;

    color:var(--ink-soft);

    line-height:1.7;
}


/* =========================================
   SECTION
========================================= */

.section{
    padding:10px 0 50px;
}

.section-title{
    text-align:center;

    margin-bottom:24px;

    font-size:26px;

    font-weight:800;

    color:var(--blue-deep);
}


/* =========================================
   IMPACT CARDS
========================================= */

.impact-cards{
    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:14px;
}

.impact-card{
    padding:22px 10px;

    text-align:center;

    background:#fff;

    border:
        1px solid var(--border);

    border-radius:20px;

    box-shadow:
        0 8px 18px rgba(6,71,141,.06);

    transition:.25s;
}

.impact-card:hover{
    transform:translateY(-4px);

    box-shadow:
        0 12px 25px rgba(6,71,141,.11);
}

.impact-icon{
    width:54px;
    height:54px;

    margin:0 auto 12px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#fff1e0;

    font-size:26px;
}

.impact-card h4{
    margin:4px 0;

    color:var(--blue-deep);

    font-size:16px;

    font-weight:800;
}

.impact-card p{
    margin:0;

    color:var(--ink-soft);

    font-size:12.5px;

    line-height:1.5;
}


/* =========================================
   DAILY PLANS
========================================= */

.plans-box{
    margin-top:18px;

    padding:30px 26px;

    background:#fff;

    border:
        1px solid var(--border);

    border-radius:26px;

    box-shadow:
        0 10px 26px rgba(6,71,141,.07);
}

.plans-title{
    text-align:center;

    margin-bottom:22px;
}

.plans-title strong{
    display:block;

    color:var(--blue-deep);

    font-size:24px;

    font-weight:800;
}

.plans-title span{
    color:var(--ink-soft);

    font-size:14px;
}

.plan-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:14px;
}

.plan{
    position:relative;

    padding:22px 10px;

    text-align:center;

    background:var(--cream);

    border:
        2px solid var(--border);

    border-radius:18px;

    cursor:pointer;

    user-select:none;

    transition:.2s;
}

.plan:hover{
    transform:translateY(-3px);
}

.plan input{
    position:absolute;

    opacity:0;

    pointer-events:none;
}

.plan-amount{
    display:inline-block;

    color:var(--blue-deep);

    font-size:38px;

    font-weight:800;

    line-height:1;
}

.plan.selected{
    border-color:var(--green);

    background:#f0fdf4;

    box-shadow:
        0 8px 20px rgba(22,163,74,.18);

    transform:translateY(-3px);
}

.plan.selected .plan-amount{
    color:var(--green);
}

.plan-daily{
    margin:8px 0 12px;

    color:var(--ink-soft);

    font-size:13.5px;
}

.plan-month{
    display:inline-block;

    padding:6px 12px;

    border-radius:30px;

    background:var(--blue-soft);

    color:var(--blue-deep);

    font-size:12.5px;

    font-weight:800;
}

.plan-selected{
    display:block;

    margin-top:8px;

    color:var(--green);

    font-size:12.5px;

    font-weight:800;

    opacity:0;
}

.plan.selected .plan-selected{
    opacity:1;
}


/* =========================================
   DONATE CTA
========================================= */

.donate-cta{
    margin-top:30px;

    padding:36px 24px;

    text-align:center;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #ff9800,
            #e94b00
        );
